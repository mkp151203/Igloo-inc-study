<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
  <title>Igloo Inc. // 3D Interactive Model Deconstruction</title>
  <meta name="description" content="Technical reverse-engineered interactive 3D Igloo model featuring procedural ice blocks, dual-stage virtual inertia physics, dynamic plexus HUD, and spatial glacial audio.">
  <link rel="icon" type="image/png" sizes="32x32" href="https://www.igloo.inc/assets/favicon32-af94112f.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="webgl-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- HUD Telemetry Overlay -->
  <div id="hud-overlay">
    <div id="plexus-tags-container"></div>
    <!-- Header / Brand -->
    <header class="hud-header">
      <div class="hud-brand">
        <span class="hud-indicator active"></span>
        <span class="hud-title">IGLOO.INC</span>
        <span class="hud-badge">RECONSTRUCTION STUDY</span>
      </div>
      <div class="hud-subtitle">
        3D INTERACTIVE SIMULATION · <a href="https://igloo.inc" target="_blank" rel="noopener noreferrer" class="hud-inline-link" title="Visit the canonical Igloo Inc. website">VISIT IGLOO.INC </a>
      </div>
    </header>

    <!-- Top Right Controls & Original Site Redirect -->
    <div class="hud-controls">
      <a href="https://igloo.inc" target="_blank" rel="noopener noreferrer" class="hud-btn hud-btn-redirect" title="Visit official Igloo Inc. website (https://igloo.inc)">
        <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>OFFICIAL SITE </span>
      </a>

      <button id="btn-audio" class="hud-btn" title="Toggle Glacial Audio (Spatial Resonance)">
        <svg id="icon-sound-on" class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="icon-sound-off" class="hud-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <span id="label-audio">AUDIO: OFF</span>
      </button>

      <button id="btn-replay" class="hud-btn" title="Replay Intro Materialization Shockwave">
        <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
        <span>REPLAY</span>
      </button>

      <button id="btn-reset" class="hud-btn" title="Reset Camera to Canonical Perspective">
        <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="12 8 8 12 12 16 12 8"></polygon>
        </svg>
        <span>RESET</span>
      </button>
    </div>

    <!-- Bottom Left Live Telemetry Panel -->
    <div class="hud-telemetry">
      <div class="hud-panel-header">
        <span class="hud-telemetry-indicator"></span>
        <span class="hud-panel-title">LIVE TELEMETRY</span>
      </div>
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <span class="telemetry-label">DISPLACED BLOCKS</span>
          <span id="telemetry-displaced" class="telemetry-val">00 / 72</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">PEAK LIFT</span>
          <span id="telemetry-peak" class="telemetry-val">+0.00 m</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">PLEXUS NODES</span>
          <span id="telemetry-plexus" class="telemetry-val">00 / 05 ACTIVE</span>
        </div>
      </div>
    </div>

    <!-- Bottom Center Guidance -->
    <div class="hud-guidance">
      <div class="guidance-chip">
        <span class="guidance-dot"></span>
        <span>HOVER to displace</span>
        <span class="guidance-sep">·</span>
        <span>DRAG to orbit</span>
      </div>
    </div>

    <!-- Bottom Right Credits & Original Site Redirect -->
    <div class="hud-credits">
      <span>ORIGINAL CONCEPT & DESIGN BY</span>
      <a href="https://igloo.inc" target="_blank" rel="noopener noreferrer" class="credit-link" title="Visit https://igloo.inc">
        IGLOO.INC 
      </a>
      <span class="hud-sep">·</span>
      <span>INDEPENDENT STUDY</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
